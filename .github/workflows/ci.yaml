name: CineOps CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cineops
          POSTGRES_PASSWORD: cineops-ci
          POSTGRES_DB: cineops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cineops -d cineops_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build project
        run: npm run build
      - name: Run PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgres://cineops:cineops-ci@localhost:5432/cineops_test
        run: npm run test:integration

  container:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --pull -t cineops:${{ github.sha }} .

      - name: Show built image
        run: docker image ls cineops

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "cineops:${{ github.sha }}"
          format: "table"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"
